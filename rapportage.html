<script>

async function verstuurRapportage(){

const rapportage = {

medewerker: document.getElementById("medewerker").value,

datum: document.getElementById("datum").value,

tijd: document.getElementById("tijd").value,

locatie: document.getElementById("locatie").value,

incident: document.getElementById("incident").value,

prioriteit: document.getElementById("prioriteit").value,

personen: document.getElementById("personen").value,

patient: document.getElementById("patient").value,

klachten: document.getElementById("klachten").value,


ABCDE: `
🅰️ Airway:
${document.getElementById("airway").value}

🅱️ Breathing:
${document.getElementById("breathing").value}

🅲 Circulation:
${document.getElementById("circulation").value}

🅳 Disability:
${document.getElementById("disability").value}

🅴 Exposure:
${document.getElementById("exposure").value}
`,


behandeling:
document.getElementById("behandeling").value,


materiaal:
document.getElementById("materiaal").value,


transport:
document.getElementById("transport").value,


bestemming:
document.getElementById("bestemming").value,


bijzonderheden:
document.getElementById("bijzonderheden").value,


opmerkingen:
document.getElementById("opmerkingen").value,


ondertekening:
document.getElementById("ondertekening").value

};



try {


const response = await fetch(
"https://botbackend.minecra.fr/rapportage",
{
method: "POST",

headers:{
"Content-Type":"application/json"
},

body: JSON.stringify(rapportage)

});


if(response.ok){

alert(
"🚑 Rapportage succesvol verzonden naar de Ambulance dienst!"
);

}else{

alert(
"❌ Er ging iets fout bij het verzenden."
);

}


}

catch(error){

console.error(error);

alert(
"❌ Backend niet bereikbaar."
);

}


}

</script>
