<!DOCTYPE html>
<html lang="nl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zen Roleplay | Ambulance Rapportage</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="logo">
🚑 Zen Roleplay Ambulance
</div>

<nav>
<a href="index.html">Home</a>
<a href="handboek.html">Handboek</a>
<a href="rapportage.html">Rapportage</a>
</nav>

</header>



<section class="handboek">


<div class="boek">


<h2>🚑 Ambulance Rapportage Portaal</h2>


<div id="login">

<h3>🔐 Ambulance toegang</h3>

<label>Toegangscode</label>

<input 
id="code"
type="password"
placeholder="Ambulance code">


<button onclick="controleerCode()">
🔓 Inloggen
</button>


</div>




<div id="rapportageFormulier" style="display:none;">


<h3>👤 Medewerker informatie</h3>


<label>Naam medewerker</label>

<input id="medewerker" type="text">


<label>🚑 Rang</label>

<select id="rang">

<option>Stagiair Ambulance</option>
<option>Ambulance Medewerker</option>
<option>Senior Ambulance Medewerker</option>
<option>Hoofd Ambulance</option>

</select>



<label>Datum</label>

<input id="datum" type="date">


<label>Tijd</label>

<input id="tijd" type="time">


<label>Locatie melding</label>

<input id="locatie" type="text">





<h3>🚨 Melding</h3>


<label>Type incident</label>

<textarea id="incident"></textarea>



<label>Prioriteit</label>


<select id="prioriteit">

<option>P1 - Spoedmelding</option>
<option>P2 - Dringende melding</option>
<option>P3 - Normale melding</option>

</select>



<label>Betrokken personen</label>

<textarea id="personen"></textarea>





<h3>🩺 Patiënt</h3>


<label>Naam patiënt</label>

<input id="patient" type="text">


<label>Klachten / letsel</label>

<textarea id="klachten"></textarea>




<h3>ABCDE</h3>


<label>A - Airway</label>
<textarea id="airway"></textarea>


<label>B - Breathing</label>
<textarea id="breathing"></textarea>


<label>C - Circulation</label>
<textarea id="circulation"></textarea>


<label>D - Disability</label>
<textarea id="disability"></textarea>


<label>E - Exposure</label>
<textarea id="exposure"></textarea>





<h3>🚑 Behandeling</h3>


<label>Uitgevoerde handelingen</label>

<textarea id="behandeling"></textarea>



<label>Medicatie / materialen</label>

<textarea id="materiaal"></textarea>



<label>Transport</label>

<select id="transport">

<option>Ja</option>
<option>Nee</option>

</select>



<label>Bestemming</label>

<input id="bestemming" type="text">





<h3>📝 Extra informatie</h3>


<label>Bijzonderheden</label>

<textarea id="bijzonderheden"></textarea>


<label>Opmerkingen</label>

<textarea id="opmerkingen"></textarea>




<label>Ondertekend door</label>

<input id="ondertekening" type="text">



<button onclick="verstuurRapportage()">
🚑 Rapportage verzenden
</button>



</div>


</div>

</section>




<script>


function controleerCode(){


let code =
document.getElementById("code").value;


if(code === "ZEN-AMBU-2026"){


document.getElementById("login").style.display="none";


document.getElementById("rapportageFormulier").style.display="block";


alert("✅ Toegang verleend");


}

else{


alert("❌ Verkeerde toegangscode");


}


}






async function verstuurRapportage(){



const rapportage = {


medewerker:
document.getElementById("medewerker").value,


rang:
document.getElementById("rang").value,


datum:
document.getElementById("datum").value,


tijd:
document.getElementById("tijd").value,


locatie:
document.getElementById("locatie").value,


incident:
document.getElementById("incident").value,


prioriteit:
document.getElementById("prioriteit").value,


personen:
document.getElementById("personen").value,


patient:
document.getElementById("patient").value,


klachten:
document.getElementById("klachten").value,


ABCDE:
`
A: ${airway.value}

B: ${breathing.value}

C: ${circulation.value}

D: ${disability.value}

E: ${exposure.value}
`,


behandeling:
document.getElementById("behandeling").value,


materiaal:
document.getElementById("materiaal").value,


transport:
document.getElementById("transport").value,


bestemming:
document.getElementById("bestemming").value,


bijzonderheden:
document.getElementById("bijzonderheden").value,


opmerkingen:
document.getElementById("opmerkingen").value,


ondertekening:
document.getElementById("ondertekening").value

};




if(
!rapportage.medewerker ||
!rapportage.rang ||
!rapportage.incident
){

alert(
"❌ Vul medewerker, rang en incident in!"
);

return;

}




try{


let response = await fetch(

"https://zen-ambulance-website.onrender.com/rapportage",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify(rapportage)

}

);



if(response.ok){


alert(
"✅ Rapportage verzonden!"
);


location.reload();


}

else{


alert(
"❌ Backend heeft de rapportage geweigerd."
);


}



}

catch(error){


alert(
"❌ Backend niet bereikbaar."
);


console.log(error);


}


}



</script>


</body>

</html>
```
