<script>

async function verstuurRapportage(){

const rapportage = {

medewerker: document.getElementById("medewerker").value,
datum: document.getElementById("datum").value,
tijd: document.getElementById("tijd").value,
locatie: document.getElementById("locatie").value,
incident: document.getElementById("incident").value,
prioriteit: document.getElementById("prioriteit").value,
personen: document.getElementById("personen").value,

patient: document.getElementById("patient").value,

klachten: document.getElementById("klachten").value,

ABCDE: `
A: ${document.getElementById("airway").value}

B: ${document.getElementById("breathing").value}

C: ${document.getElementById("circulation").value}

D: ${document.getElementById("disability").value}

E: ${document.getElementById("exposure").value}
`,

behandeling: document.getElementById("behandeling").value,

materiaal: document.getElementById("materiaal").value,

transport: document.getElementById("transport").value,

bestemming: document.getElementById("bestemming").value,

bijzonderheden: document.getElementById("bijzonderheden").value,

opmerkingen: document.getElementById("opmerkingen").value,

ondertekening: document.getElementById("ondertekening").value

};


try {


const response = await fetch(
"https://zen-ambulance-website.onrender.com/rapportage",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body: JSON.stringify(rapportage)

});


const resultaat = await response.text();


console.log("Backend antwoord:", resultaat);



if(response.ok){

alert("🚑 Rapportage succesvol verzonden!");

}else{

alert(
"❌ Backend fout:\n" + resultaat
);

}


}

catch(error){

console.error(
"Fetch fout:",
error
);


alert(
"❌ Backend niet bereikbaar.\nControleer Render."
);

}


}

</script>
