<!DOCTYPE html>
<html lang="nl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zen Roleplay | Ambulance Rapportage</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="logo">
🚑 Zen Roleplay Ambulance
</div>

<nav>
<a href="index.html">Home</a>
<a href="handboek.html">Handboek</a>
<a href="rapportage.html">Rapportage</a>
</nav>

</header>



<section class="handboek">


<div class="boek">


<h2>🚑 Ambulance Rapportage</h2>

<p>
Vul na een belangrijke inzet een korte rapportage in.
</p>



<div id="login">

<h3>🔐 Ambulance toegang</h3>

<label>Toegangscode</label>

<input 
id="code"
type="password"
placeholder="Code">


<button onclick="controleerCode()">
🔓 Inloggen
</button>

</div>




<div id="rapportageFormulier" style="display:none;">



<h3>👤 Medewerker</h3>


<label>Naam medewerker</label>

<input id="medewerker" type="text">



<label>🚑 Rang</label>

<select id="rang">

<option>In Opleiding</option>
<option>Broeder/Zuster</option>
<option>Verpleegkundige</option>
<option>Geneeskundige</option>
<option>Ambulance Leiding</option>

</select>



<label>📅 Datum</label>

<input id="datum" type="date">



<label>📍 Locatie melding</label>

<input id="locatie" type="text">





<h3>🚨 Melding</h3>


<label>⚠️ Prioriteit</label>

<select id="prioriteit">

<option>P1 - Spoedmelding</option>
<option>P2 - Dringende melding</option>
<option>P3 - Normale melding</option>

</select>



<label>Beschrijving incident</label>

<textarea id="incident"
placeholder="Wat is er gebeurd?"></textarea>





<h3>🩺 Patiënt</h3>


<label>Naam patiënt</label>

<input id="patient" type="text">



<h3>🚑 Behandeling</h3>


<label>Uitgevoerde handelingen</label>

<textarea id="behandeling"
placeholder="Wat heb je gedaan?"></textarea>



<label>Transport uitgevoerd</label>

<select id="transport">

<option>Ja</option>
<option>Nee</option>

</select>



<label>🏥 Bestemming</label>

<input id="bestemming" type="text">



<h3>✍️ Ondertekening</h3>


<label>Ondertekend door</label>

<input id="ondertekening" type="text">



<button onclick="verstuurRapportage()">
🚑 Rapportage verzenden
</button>



</div>


</div>

</section>



<footer>

© 2026 Zen Roleplay Ambulance Dienst

</footer>


<script>


function controleerCode(){


const code = document.getElementById("code").value;


if(code === "ZEN-AMBU-2026"){


document.getElementById("login").style.display="none";


document.getElementById("rapportageFormulier").style.display="block";


alert("✅ Toegang verleend");


}

else{


alert("❌ Verkeerde toegangscode");


}


}





async function verstuurRapportage(){



const rapportage = {


medewerker:
document.getElementById("medewerker").value,


rang:
document.getElementById("rang").value,


datum:
document.getElementById("datum").value,


locatie:
document.getElementById("locatie").value,


prioriteit:
document.getElementById("prioriteit").value,


incident:
document.getElementById("incident").value,


patient:
document.getElementById("patient").value,


behandeling:
document.getElementById("behandeling").value,


transport:
document.getElementById("transport").value,


bestemming:
document.getElementById("bestemming").value,


ondertekening:
document.getElementById("ondertekening").value


};





// Controle verplichte velden

if(
!rapportage.medewerker ||
!rapportage.rang ||
!rapportage.locatie ||
!rapportage.incident
){


alert(
"❌ Vul medewerker, rang, locatie en incident in!"
);


return;


}





try{


const response = await fetch(

"https://zen-ambulance-website.onrender.com/rapportage",

{

method:"POST",

headers:{


"Content-Type":"application/json"


},


body:JSON.stringify(rapportage)


}

);




const resultaat = await response.text();



console.log(
"Backend:",
resultaat
);




if(response.ok){


alert(
"🚑 Rapportage succesvol verzonden!"
);



// formulier leegmaken

document.getElementById("rapportageFormulier").reset();


}

else{


alert(
"❌ Backend fout:\n" + resultaat
);


}



}


catch(error){


console.error(error);


alert(
"❌ Backend niet bereikbaar."
);


}



}



</script>


</body>

</html>
